[pytest]
testpaths = tests/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    asyncio: marks tests as async
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests requiring ROS/MoveIt
    execution: marks tests that will move the robot (use with extreme caution)
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
